<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>London Bus Times</title>
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <script type="text/javascript" src="script.js"></script>
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>London Bus Times</h1>
            <div id="stop-name">Choose a boarding stop</div>
            <button id="change-stop" class="is-hidden" type="button">Change stop</button>
        </div>

        <div id="stop-picker">
            <div id="recent-stops" class="is-hidden">
                <div class="picker-title">Recent stops</div>
                <div id="recent-list"></div>
            </div>
            <button id="add-stop" class="add-stop" type="button">+ Add new stop</button>
            <div id="add-panel" class="is-hidden">
                <div class="picker-title">Add a new stop</div>
                <div id="search-controls" class="input-row">
                    <label for="stop-search">Stop name, 5-digit code or stop ID</label>
                    <input id="stop-search" type="text" autocapitalize="off" autocomplete="off" placeholder="e.g. Victoria, 73231 or 490008660N">
                    <button id="search-stop" type="button">Search</button>
                    <button id="cancel-add" type="button">Cancel</button>
                </div>
            </div>
        </div>
        <div id="search-results"></div>

        <div id="arrivals-heading">
            <span>Live departures</span>
            <button id="refresh" type="button">Refresh now</button>
        </div>
        <div id="status" class="notice">Search for a bus stop to begin.</div>
        <div id="filter-bar" class="is-hidden">
            <button id="filter-toggle" type="button">Routes: all</button>
        </div>
        <div id="filter-panel" class="is-hidden"></div>
        <div id="disruption" class="is-hidden"></div>
        <div id="vehicle-detail" class="is-hidden"></div>
        <div id="arrivals"></div>

        <div id="footer">
            <span id="refresh-summary">Refreshes every 1 min</span>
            <span id="countdown">Not scheduled</span>
            <button id="toggle-settings" type="button">Settings</button>
        </div>
        <div id="settings" class="is-hidden">
            <div class="picker-title">Auto-refresh</div>
            <label for="refresh-interval">Refresh arrivals every</label>
            <select id="refresh-interval">
                <option value="30">30 seconds</option>
                <option value="60">1 minute</option>
                <option value="120">2 minutes</option>
                <option value="300">5 minutes</option>
                <option value="600">10 minutes</option>
            </select>
            <button id="save-settings" type="button">Save setting</button>
            <div class="settings-note">A shorter interval uses more Wi-Fi and battery.</div>
            <div class="picker-title update-title">Updates</div>
            <div id="update-text"></div>
            <button id="check-update" type="button">Check for updates</button>
        </div>
    </div>
</body>
</html>
